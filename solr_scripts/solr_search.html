<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MHS Photo Search</title>
    <link rel="stylesheet" href="solr_search.css" />
    <script type="module" src="solr_search.js" defer></script>
  </head>
  <body>
    <header>
      <h1>MHS Photo Search</h1>
    </header>

    <main>
      <div class="search-bar">
        <input
          type="text"
          id="query"
          placeholder="Search subjects, keywords, headlines, artists…"
          aria-label="Search photo metadata"
        />
        <div class="limit-group">
          <label for="limit">Limit</label>
          <input type="number" id="limit" value="10" min="1" max="500" />
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="publishedOnly" />
          Published
        </label>
        <button id="searchBtn">Search</button>
      </div>

      <div class="status" id="status"></div>

      <div id="results"></div>
    </main>
  </body>
</html>
