<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MHS Photo Search</title>
    <link rel="stylesheet" href="solr_search.css" />
    <script type="module" src="solr_search.js" defer></script>
  </head>
  <body>
    <header>
      <h1>MHS Photo Search</h1>
    </header>

    <main>
      <form id="search-form" class="search-bar" method="get">
        <input
          type="text"
          id="query"
          name="query"
          placeholder="Search subjects, keywords, headlines, artists…"
          aria-label="Search photo metadata"
        />
        <div class="limit-group">
          <label for="limit">Limit</label>
          <input
            type="number"
            id="limit"
            name="limit"
            value="10"
            min="1"
            max="500"
          />
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="publishedOnly" name="isPublished" />
          Published
        </label>
        <button class="search-btn" type="submit">Search</button>
      </form>

      <div class="status" id="status"></div>

      <div id="results"></div>
    </main>
  </body>
</html>
