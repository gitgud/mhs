<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MHS Photo Search</title>
    <link rel="stylesheet" href="solr_search.css" />
    <script type="module" src="solr_search.js" defer></script>
  </head>
  <body>
    <header>
      <h1>MHS Photo Search</h1>
    </header>

    <main>
      <form id="search-form" class="search-form" method="get">
        <div class="query-field">
          <input
            type="text"
            id="query"
            name="query"
            placeholder="Search subjects, keywords, headlines, artists…"
            aria-label="Search photo metadata"
          />
          <button
            id="clear-button"
            class="clear-btn"
            type="button"
            aria-label="Clear search"
            hidden
          >
            <svg focusable="false" aria-hidden="true" viewBox="0 0 24 24">
              <path
                d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
              ></path>
            </svg>
          </button>
        </div>
        <div class="limit-group">
          <label for="limit">Limit</label>
          <input
            type="number"
            id="limit"
            name="limit"
            value="10"
            min="1"
            max="500"
          />
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="publishedOnly" name="isPublished" />
          Published
        </label>
        <button class="search-btn" type="submit">Search</button>
      </form>

      <div class="status" id="status" role="status"></div>

      <div id="results"></div>
    </main>
  </body>
</html>
